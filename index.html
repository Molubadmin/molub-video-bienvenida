<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenido</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 12px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #f3f4f6;
      overflow: hidden;
    }

    #player {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .end-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: background 1.2s ease, opacity 1.2s ease;
    }

    .end-overlay.visible {
      background: rgba(0, 0, 0, 0.82);
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-content {
      transform: translateY(18px);
      opacity: 0;
      text-align: center;
      transition: transform 0.9s ease, opacity 0.9s ease;
      transition-delay: 0.35s;
      padding: 24px;
      width: 100%;
      max-width: 760px;
    }

    .end-overlay.visible .overlay-content {
      transform: translateY(0);
      opacity: 1;
    }

    .overlay-title {
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .overlay-subtitle {
      color: rgba(255,255,255,0.82);
      font-size: 14px;
      letter-spacing: 0.04em;
      margin-bottom: 28px;
    }

    .buttons-box {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 240px;
      padding: 16px 30px;
      background: linear-gradient(180deg, #1a1aff 0%, #0000FA 100%);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 10px 30px rgba(0,0,250,0.28),
        inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      backdrop-filter: blur(4px);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 40px rgba(0,0,250,0.38),
        inset 0 1px 0 rgba(255,255,255,0.2);
      background: linear-gradient(180deg, #2a2aff 0%, #0000d8 100%);
    }

    .timer-bar-wrap {
      width: 100%;
      max-width: 1100px;
      height: 4px;
      background: rgba(0,0,0,0.12);
      margin-top: 8px;
      overflow: hidden;
    }

    .timer-bar {
      width: 0%;
      height: 100%;
      background: #0000FA;
      transition: width 0.1s linear, background 0.4s ease;
    }

    .timer-label {
      color: #555;
      font-size: 12px;
      margin-top: 6px;
      text-align: center;
      letter-spacing: 0.03em;
    }

    @media (max-width: 768px) {
      .overlay-title {
        font-size: 22px;
      }

      .overlay-subtitle {
        font-size: 13px;
        margin-bottom: 22px;
      }

      .buttons-box {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 100%;
        max-width: 320px;
        min-width: unset;
      }
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <iframe
      id="player"
      src="https://www.youtube.com/embed/q2-KfM1y7F0?enablejsapi=1&rel=0&modestbranding=1"
      title="Video de bienvenida"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

    <div class="end-overlay" id="endOverlay">
      <div class="overlay-content">
        <div class="overlay-title">Bienvenido a Molub Academy</div>
        <div class="overlay-subtitle">Tu video de bienvenida ha finalizado. Continúa con tu proceso de formación.</div>
        <div class="buttons-box">
          <a href="https://molubacademy.moodlecloud.com/my/courses.php" target="_blank" class="btn">
            Ir a mis cursos
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="timer-label" id="timerLabel">▶ Presiona play para comenzar</div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let intervalo = null;

    const bar = document.getElementById("timerBar");
    const label = document.getElementById("timerLabel");
    const overlay = document.getElementById("endOverlay");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady() {
      label.textContent = "▶ Presiona play para comenzar";
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        iniciarBarra();
        label.textContent = "▶ Reproduciendo video...";
      }

      if (event.data === YT.PlayerState.PAUSED) {
        detenerBarra();
        label.textContent = "⏸ Video pausado";
      }

      if (event.data === YT.PlayerState.ENDED) {
        detenerBarra();
        bar.style.width = "100%";
        bar.style.background = "#00c853";
        label.textContent = "✅ Video terminado";
        overlay.classList.add("visible");
      }
    }

    function onPlayerError() {
      label.textContent = "⚠ Error al cargar el video";
    }

    function iniciarBarra() {
      detenerBarra();

      intervalo = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== "function") return;

        const duracion = player.getDuration();
        const tiempo = player.getCurrentTime();

        if (duracion > 0) {
          const pct = Math.min((tiempo / duracion) * 100, 100);
          bar.style.width = pct + "%";

          const restante = Math.max(duracion - tiempo, 0);
          label.textContent = `⏱ ${restante.toFixed(1)}s restantes`;
        }
      }, 100);
    }

    function detenerBarra() {
      if (intervalo) {
        clearInterval(intervalo);
        intervalo = null;
      }
    }
  </script>

</body>
</html>
