<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenido</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Segoe UI',sans-serif;
}

/* CONTENEDOR MÁS GRANDE */
.video-wrapper{
  position:relative;
  width:100%;
  max-width:1100px;
  aspect-ratio:16/9;
}

/* VIDEO */
iframe{
  width:100%;
  height:100%;
  border:none;
  border-radius:12px;
}

/* BOTONES */
.buttons-overlay{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:80px 20px 36px;
  background:linear-gradient(transparent,rgba(0,0,0,0.95));
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;

  opacity:0;
  pointer-events:none;
  transition:opacity 1.5s ease;
}

.buttons-overlay.visible{
  opacity:1;
  pointer-events:all;
}

.btn{
  padding:16px 36px;
  background:#0000FA;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  border-radius:10px;
  border:2px solid #3333ff;
  box-shadow:0 4px 22px rgba(0,0,250,0.5);
  transition:.3s;
  letter-spacing:0.05em;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 32px rgba(0,0,250,0.7);
}

/* BARRA */
.timer-bar-wrap{
  width:100%;
  max-width:1100px;
  height:4px;
  background:rgba(255,255,255,0.1);
  margin-top:8px;
}

.timer-bar{
  height:100%;
  width:0%;
  background:#0000FA;
  transition:width linear;
}

.timer-label{
  color:rgba(255,255,255,0.4);
  font-size:12px;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="video-wrapper">

<!-- VIDEO CON SONIDO (SIN AUTOPLAY) -->
<iframe
src="https://www.youtube.com/embed/q2-KfM1y7F0?controls=1&rel=0&modestbranding=1"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

<!-- BOTONES -->
<div class="buttons-overlay" id="botonesFinales">

<a href="https://molubacademy.moodlecloud.com/my/courses.php" target="_blank" class="btn">
🎓 IR A MIS CURSOS
</a>

<a href="#" target="_blank" class="btn">
🤖 GUÍA DEL CHATBOT
</a>

</div>

</div>

<!-- BARRA -->
<div class="timer-bar-wrap">
<div class="timer-bar" id="timerBar"></div>
</div>

<div class="timer-label" id="timerLabel">
▶ Presiona play para comenzar
</div>

<script>
const DURACION = 17000;
const INTERVALO = 100;

let tiempo = 0;
let iniciado = false;

const bar = document.getElementById("timerBar");
const label = document.getElementById("timerLabel");
const overlay = document.getElementById("botonesFinales");

/* Detecta interacción del usuario */
window.addEventListener("click", iniciar);

function iniciar(){
  if(iniciado) return;
  iniciado = true;

  label.textContent = "▶ Reproduciendo video...";

  const timer = setInterval(()=>{
    tiempo += INTERVALO;

    let pct = Math.min((tiempo/DURACION)*100,100);
    bar.style.width = pct + "%";

    let restante = ((DURACION-tiempo)/1000).toFixed(1);
    if(restante > 0){
      label.textContent = "⏱ " + restante + "s restantes";
    }

    if(tiempo >= DURACION){
      clearInterval(timer);
      overlay.classList.add("visible");
      label.textContent = "✅ Video terminado";
      bar.style.background = "#00c853";
    }

  },INTERVALO);
}
</script>

</body>
</html>
