<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenido</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      padding: 12px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #f3f3f3;
      overflow: hidden;
    }

    #player {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .buttons-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 80px 20px 36px;
      background: linear-gradient(transparent, rgba(0,0,0,0.93));
      display: flex;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    .buttons-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .btn {
      display: inline-block;
      padding: 18px 40px;
      background: #0000FA;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid #3333ff;
      box-shadow: 0 4px 22px rgba(0,0,250,0.5);
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(0,0,250,0.7);
    }

    .timer-bar-wrap {
      width: 100%;
      max-width: 1100px;
      height: 4px;
      background: rgba(0,0,0,0.1);
      margin-top: 8px;
      overflow: hidden;
    }

    .timer-bar {
      width: 0%;
      height: 100%;
      background: #0000FA;
      transition: width 0.1s linear;
    }

    .timer-label {
      color: #555;
      font-size: 12px;
      margin-top: 6px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .buttons-overlay {
        padding: 40px 14px 20px;
      }

      .btn {
        width: 100%;
        max-width: 320px;
        text-align: center;
        padding: 16px 22px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <iframe
      id="player"
      src="https://www.youtube.com/embed/q2-KfM1y7F0?enablejsapi=1&rel=0&modestbranding=1"
      title="Video de bienvenida"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

    <div class="buttons-overlay" id="botonesFinales">
      <a href="https://molubacademy.moodlecloud.com/my/courses.php" target="_blank" class="btn">
        🎓 Ir a mis cursos
      </a>
    </div>
  </div>

  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="timer-label" id="timerLabel">▶ Presiona play para comenzar</div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let intervalo = null;

    const bar = document.getElementById("timerBar");
    const label = document.getElementById("timerLabel");
    const overlay = document.getElementById("botonesFinales");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady() {
      label.textContent = "▶ Presiona play para comenzar";
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        iniciarBarra();
      }

      if (event.data === YT.PlayerState.PAUSED) {
        detenerBarra();
        label.textContent = "⏸ Video pausado";
      }

      if (event.data === YT.PlayerState.ENDED) {
        detenerBarra();
        bar.style.width = "100%";
        bar.style.background = "#00c853";
        label.textContent = "✅ Video terminado";
        overlay.classList.add("visible");
      }
    }

    function onPlayerError() {
      label.textContent = "⚠ Error al cargar el video";
    }

    function iniciarBarra() {
      detenerBarra();

      intervalo = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== "function") return;

        const duracion = player.getDuration();
        const tiempo = player.getCurrentTime();

        if (duracion > 0) {
          const pct = Math.min((tiempo / duracion) * 100, 100);
          bar.style.width = pct + "%";

          const restante = Math.max(duracion - tiempo, 0);
          label.textContent = `⏱ ${restante.toFixed(1)}s restantes`;
        }
      }, 100);
    }

    function detenerBarra() {
      if (intervalo) {
        clearInterval(intervalo);
        intervalo = null;
      }
    }
  </script>

</body>
</html>
