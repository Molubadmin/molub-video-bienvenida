<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenido</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .video-wrapper {
      position: relative;
      width: 640px;
      max-width: 100%;
    }

    iframe {
      display: block;
      width: 640px;
      max-width: 100%;
      height: 480px;
      border: none;
      border-radius: 10px;
    }

    /* ── Overlay de botones ── */
    .buttons-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 80px 20px 36px;
      background: linear-gradient(transparent, rgba(0,0,0,0.93));
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      border-radius: 0 0 10px 10px;

      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    .buttons-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .btn {
      display: inline-block;
      padding: 16px 36px;
      background-color: #0000FA;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border: 2px solid #3333ff;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 4px 22px rgba(0,0,250,0.5);
    }

    .btn:hover {
      background-color: #0000cc;
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(0,0,250,0.7);
    }

    /* ── Barra de progreso del temporizador ── */
    .timer-bar-wrap {
      width: 640px;
      max-width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 0%;
      background: #0000FA;
      border-radius: 2px;
      transition: width linear;
    }

    /* ── Label de tiempo ── */
    .timer-label {
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      margin-top: 6px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="video-wrapper">

    <iframe
      src="https://drive.google.com/file/d/1GaqMU8d9gKMmXil2ioFphRjDprdAH6gm/preview"
      allow="autoplay"
      allowfullscreen
    ></iframe>

    <!-- Botones con desvanecimiento -->
    <div class="buttons-overlay" id="botonesFinales">
      <!--
        ✏️ CAMBIA ESTOS LINKS POR LOS TUYOS:
      -->
      <a href="https://molubacademy.moodlecloud.com/my/courses.php" target="_blank" class="btn">
        🎓 IR A MIS CURSOS
      </a>
      <a href="https://TU-LINK-CHATBOT.com" target="_blank" class="btn">
        🤖 GUÍA DEL CHATBOT
      </a>
    </div>

  </div>

  <!-- Barra de progreso visual -->
  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>
  <div class="timer-label" id="timerLabel">Cargando video...</div>

  <script>
    // Duración exacta del video en milisegundos (16.1 segundos)
    const DURACION_MS = 16100;
    const INTERVALO   = 100; // tick cada 100ms = precisión de 0.1s

    const overlay = document.getElementById('botonesFinales');
    const bar     = document.getElementById('timerBar');
    const label   = document.getElementById('timerLabel');

    let transcurrido = 0;

    label.textContent = '▶ Reproduciendo video...';

    // El iframe de Drive tarda ~1.5s en cargar antes de reproducir
    // Iniciamos el contador cuando el usuario ve el video
    const inicio = setTimeout(() => {
      const timer = setInterval(() => {
        transcurrido += INTERVALO;

        // Barra de progreso
        const pct = Math.min((transcurrido / DURACION_MS) * 100, 100);
        bar.style.transition = `width ${INTERVALO}ms linear`;
        bar.style.width = pct + '%';

        // Segundos restantes
        const restante = ((DURACION_MS - transcurrido) / 1000).toFixed(1);
        if (restante > 0) {
          label.textContent = `⏱ ${restante}s restantes`;
        }

        // Al terminar exactamente → botones aparecen
        if (transcurrido >= DURACION_MS) {
          clearInterval(timer);
          mostrarBotones();
        }
      }, INTERVALO);
    }, 1500); // espera 1.5s de carga del iframe

    function mostrarBotones() {
      overlay.classList.add('visible');
      label.textContent = '✅ Video terminado';
      bar.style.background = '#00c853';
      bar.style.width = '100%';
    }
  </script>

</body>
</html>
