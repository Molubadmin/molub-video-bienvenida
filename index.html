<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenido</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:'Segoe UI',sans-serif;
}

.video-wrapper{
  position:relative;
  width:100%;
  max-width:1100px;
  aspect-ratio:16/9;
}

#player{
  width:100%;
  height:100%;
  border-radius:12px;
}

/* BOTONES FLOTANTES */
.buttons-overlay{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:80px 20px 36px;
  background:linear-gradient(transparent,rgba(0,0,0,0.95));
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;

  opacity:0;
  pointer-events:none;
  transition:opacity 1.5s ease;
}

.buttons-overlay.visible{
  opacity:1;
  pointer-events:all;
}

.btn{
  padding:16px 36px;
  background:#0000FA;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  border-radius:10px;
  border:2px solid #3333ff;
  box-shadow:0 4px 22px rgba(0,0,250,0.5);
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 32px rgba(0,0,250,0.7);
}
</style>
</head>

<body>

<div class="video-wrapper">

<div id="player"></div>

<div class="buttons-overlay" id="botonesFinales">
  <a href="https://molubacademy.moodlecloud.com/my/courses.php" target="_blank" class="btn">
    🎓 IR A MIS CURSOS
  </a>

  <a href="#" target="_blank" class="btn">
    🤖 GUÍA DEL CHATBOT
  </a>
</div>

</div>

<!-- API DE YOUTUBE -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: 'q2-KfM1y7F0',
    playerVars: {
      controls: 1,
      rel: 0,
      modestbranding: 1
    },
    events: {
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerStateChange(event) {
  // 0 = video terminado
  if (event.data === 0) {
    document.getElementById('botonesFinales').classList.add('visible');
  }
}
</script>

</body>
</html>
